<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Errores — NOR Logística</title>
<style>
  :root{
    --bg:#EEF0F2; --card:#FFFFFF; --ink:#1B2430; --ink-soft:#5B6672;
    --navy:#16213E; --navy-2:#1F2E52;
    --amber:#C7811A; --amber-bg:#FBEEDA;
    --green:#3F7D58; --green-bg:#E4F0E8;
    --line:#DCE1E6;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  #app{max-width:560px;margin:0 auto;min-height:100vh;}
  .topbar{background:var(--navy);color:#fff;padding:18px;position:sticky;top:0;z-index:5;}
  .topbar .title{font-size:20px;font-weight:700;}
  .topbar .stats{font-family:var(--mono);font-size:12.5px;color:#B9C2D6;margin-top:4px;}
  .topbar .stats b{color:var(--amber);font-weight:600;}
  .filters{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;background:var(--navy-2);position:sticky;top:62px;z-index:4;}
  .chip{flex:0 0 auto;padding:6px 13px;border-radius:100px;font-size:13px;color:#D7DDEA;border:1px solid rgba(255,255,255,0.18);background:transparent;cursor:pointer;white-space:nowrap;}
  .chip.active{background:#fff;color:var(--navy);border-color:#fff;font-weight:600;}
  .feed{padding:14px;display:flex;flex-direction:column;gap:10px;}
  .empty{color:var(--ink-soft);text-align:center;padding:40px 20px;font-size:14px;line-height:1.5;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .fecha{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap;}
  .badge.resuelto{background:var(--green-bg);color:var(--green);}
  .badge.pendiente{background:var(--amber-bg);color:var(--amber);}
  .tipo{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--navy-2);background:#EEF1F8;padding:2px 8px;border-radius:6px;}
  .desc{font-size:14.5px;line-height:1.44;margin-top:8px;}
  .meta-line{font-size:12.5px;color:var(--ink-soft);margin-top:7px;}
  .meta-line b{color:var(--ink);font-weight:600;}
  .extra{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);}
  .extra-row{font-size:13px;line-height:1.45;margin-bottom:8px;}
  .extra-row .label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:block;margin-bottom:2px;}
  .resolucion{margin-top:9px;padding:10px 11px;border-radius:9px;background:var(--green-bg);border:1px solid #CFE4D7;}
  .resolucion .label{font-family:var(--mono);font-size:11px;color:var(--green);display:block;margin-bottom:3px;font-weight:600;}
  .resolucion .txt{font-size:13.5px;color:#2C5A3E;line-height:1.45;}
  .footer-note{padding:16px;text-align:center;font-size:11.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">Registro de Errores</div>
    <div class="stats" id="stats">Cargando…</div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="feed" id="feed"></div>
  <div class="footer-note">Para cargar un error nuevo o marcar uno resuelto, avisale a Iván.</div>
</div>
<script>
let errores = [];
let filtroEstado = 'todos';

function fmtFecha(str){
  const d = new Date(str + 'T00:00:00');
  if(isNaN(d)) return str;
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate() + ' ' + meses[d.getMonth()];
}

async function loadData(){
  try{
    const res = await fetch('data.json', {cache:"no-store"});
    errores = await res.json();
    errores.forEach((e, i) => e.id = 'e' + i);
    render();
  }catch(e){
    document.getElementById('feed').innerHTML = '<div class="empty">No se pudo cargar el registro.</div>';
  }
}

function render(){
  const total = errores.length;
  const pendientes = errores.filter(e => e.estado === 'Sin resolver').length;
  document.getElementById('stats').innerHTML = total + ' registrados · <b>' + pendientes + ' sin resolver</b>';

  const filtros = document.getElementById('filters');
  filtros.innerHTML = '';
  [['todos','Todos'],['Sin resolver','Sin resolver'],['Resuelto','Resueltos']].forEach(([val,label]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (filtroEstado === val ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { filtroEstado = val; render(); };
    filtros.appendChild(b);
  });

  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  let lista = errores.slice().reverse();
  if(filtroEstado !== 'todos') lista = lista.filter(e => e.estado === filtroEstado);

  if(lista.length === 0){
    feed.innerHTML = '<div class="empty">No hay errores que coincidan con el filtro.</div>';
    return;
  }

  lista.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card';
    const badgeClass = e.estado === 'Resuelto' ? 'resuelto' : 'pendiente';
    card.innerHTML = `
      <div class="card-top">
        <span class="fecha">${fmtFecha(e.fecha)}</span>
        <span class="badge ${badgeClass}">${e.estado}</span>
      </div>
      <span class="tipo">${e.tipo}</span>
      <div class="desc">${e.desc}</div>
      <div class="meta-line"><b>${e.resp || '—'}</b> · ${e.cliente || '—'}</div>
      <div class="extra">
        <div class="extra-row"><span class="label">Acción correctiva</span>${e.accion || '—'}</div>
        ${e.obs ? `<div class="extra-row"><span class="label">Observaciones</span>${e.obs}</div>` : ''}
      </div>
      ${e.estado === 'Resuelto' && e.resolucion ? `
        <div class="resolucion">
          <span class="label">Cómo se resolvió</span>
          <div class="txt">${e.resolucion}</div>
        </div>` : ''}
    `;
    feed.appendChild(card);
  });
}

loadData();
</script>
</body>
</html>
